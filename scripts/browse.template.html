<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Posts</title>
<style>
:root {
  --bg: #f6f3ee;
  --panel: #fbf9f5;
  --card: #ffffff;
  --ink: #1d1b18;
  --ink-2: #5d5850;
  --ink-3: #8f887d;
  --line: #e6e0d6;
  --line-2: #d8d0c3;
  --accent: #c2410c;
  --accent-soft: #fbe6d9;
  --mark: #fde68a;
  --shadow: 0 1px 2px rgba(40, 30, 10, .05), 0 4px 16px rgba(40, 30, 10, .04);
  --serif: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --panel: #1b1a17; --card: #201f1c; --ink: #eeebe5; --ink-2: #b4ada2; --ink-3: #7f786d;
    --line: #2d2b27; --line-2: #3a3732; --accent: #fb923c; --accent-soft: #3a2416; --mark: #6b4f0f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --panel: #1b1a17; --card: #201f1c; --ink: #eeebe5; --ink-2: #b4ada2; --ink-3: #7f786d;
  --line: #2d2b27; --line-2: #3a3732; --accent: #fb923c; --accent-soft: #3a2416; --mark: #6b4f0f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
aside {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel);
  border-right: 1px solid var(--line); padding: 28px 20px 40px;
}
main { padding: 28px clamp(16px, 4vw, 56px) 80px; }
.inner { max-width: 760px; margin: 0 auto; }

.brand { font: 600 26px/1.1 var(--serif); letter-spacing: -.01em; margin: 0 0 4px; }
.brand em { font-style: italic; color: var(--accent); }
.meta { color: var(--ink-3); font-size: 12.5px; margin: 0 0 22px; }

.label { font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { padding: 6px 4px; border-radius: 7px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.seg small { color: var(--ink-3); font: 11px var(--mono); margin-left: 3px; }

.years { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
.years button { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
.years i { display: block; width: 100%; background: var(--line-2); border-radius: 3px 3px 1px 1px; min-height: 2px; transition: background .15s; }
.years span { font: 10px var(--mono); color: var(--ink-3); }
.years button:hover i { background: var(--ink-3); }
.years button[aria-pressed="true"] i { background: var(--accent); }
.years button[aria-pressed="true"] span { color: var(--accent); font-weight: 600; }

.group-title { font: 600 12px var(--sans); color: var(--ink-2); margin: 14px 0 4px; display: flex; justify-content: space-between; }
.topic { width: 100%; text-align: left; display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; font-size: 13.5px; }
.topic:hover { background: var(--bg); }
.topic[aria-pressed="true"] { background: var(--accent-soft); }
.topic .dot { width: 9px; height: 9px; border-radius: 50%; }
.topic .n { font: 11px var(--mono); color: var(--ink-3); }
.topic .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subs { margin: 0 0 6px 18px; border-left: 1px solid var(--line); padding-left: 6px; }
.subs .topic { font-size: 12.5px; padding: 4px 8px; color: var(--ink-2); grid-template-columns: 1fr auto; }

.search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 14px; }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
#q {
  width: 100%; font: 17px var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--line-2);
  border-radius: 14px; padding: 14px 52px 14px 46px; outline: none; box-shadow: var(--shadow);
}
#q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.toolbar .count { font-weight: 600; color: var(--ink); margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; }
.chip button { width: 18px; height: 18px; border-radius: 50%; color: var(--ink-3); line-height: 1; }
.chip button:hover { background: var(--bg); color: var(--ink); }
.toolbar .spacer { flex: 1; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.toggle { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); }
.toggle[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 14px;
  margin-bottom: 12px; box-shadow: var(--shadow); outline: none; transition: border-color .15s;
}
.card:focus-visible, .card.focus { border-color: var(--accent); }
.head { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 14px var(--sans); flex: none; }
.who { min-width: 0; flex: 1; }
.who a { font-weight: 600; text-decoration: none; }
.who a:hover { text-decoration: underline; }
.who .sub { color: var(--ink-3); font-size: 12.5px; }
.badge { font: 600 10.5px var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-3); }
.badge.new { background: var(--accent); color: #fff; border-color: var(--accent); }
.open { font-size: 12.5px; color: var(--ink-3); text-decoration: none; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.open:hover { background: var(--bg); color: var(--accent); }
.text { margin: 10px 0 0 44px; white-space: pre-line; overflow-wrap: anywhere; font-size: 15px; }
.text.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.more { margin: 4px 0 0 44px; font-size: 13px; color: var(--accent); }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 0 44px; }
.tag { --ink-c: var(--c); font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid transparent; color: var(--ink-c); }
.tag.main { background: color-mix(in srgb, var(--c) 13%, transparent); }
.tag.sub { border-color: color-mix(in srgb, var(--c) 35%, transparent); }
:root[data-theme="dark"] .tag { --ink-c: color-mix(in srgb, var(--c) 55%, white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { --ink-c: color-mix(in srgb, var(--c) 55%, white); } }
.tag:hover { filter: brightness(.95); text-decoration: underline; }
.sep { color: var(--ink-3); font-size: 12px; }
.media { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }

.empty { text-align: center; color: var(--ink-3); padding: 80px 0; font-family: var(--serif); font-size: 20px; }
#sentinel { height: 1px; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
.side-foot { margin-top: 26px; display: flex; gap: 8px; flex-wrap: wrap; }
.help { color: var(--ink-3); font-size: 12px; line-height: 1.7; margin-top: 18px; }
.help code { font: 11px var(--mono); background: var(--bg); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
#filters-btn { display: none; }
.scrim { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.drawer aside { transform: none; }
  body.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; }
  #filters-btn { display: inline-flex; }
  main { padding: 16px 16px 60px; }
  .text, .more, .foot { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1 class="brand">Saved <em>posts</em></h1>
    <p class="meta" id="meta"></p>
    <div class="label">Source</div>
    <div class="seg" id="sources"></div>
    <div class="label">Year posted</div>
    <div class="years" id="years"></div>
    <div class="label">Topics</div>
    <div id="topics"></div>
    <div class="side-foot">
      <button class="icon-btn" id="theme">◐ Theme</button>
      <button class="icon-btn" id="reset">Reset filters</button>
    </div>
    <div class="help">
      <code>/</code> search · <code>j</code>/<code>k</code> next/prev · <code>o</code> open on X<br>
      <code>@handle</code> by author · <code>"exact phrase"</code> · <code>-word</code> exclude
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="inner">
      <div class="search">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search posts, @authors, topics…" autocomplete="off" spellcheck="false">
          <span class="kbd">/</span>
        </div>
        <div class="toolbar">
          <button class="icon-btn" id="filters-btn">☰ Filters</button>
          <span class="count" id="count"></span>
          <span id="chips"></span>
          <span class="spacer"></span>
          <button class="toggle" id="fresh" hidden>New in last harvest</button>
          <select id="sort" aria-label="Sort">
            <option value="saved">Recently saved</option>
            <option value="new">Newest posts</option>
            <option value="old">Oldest posts</option>
            <option value="author">By author</option>
          </select>
        </div>
      </div>
      <div id="list"></div>
      <div id="sentinel"></div>
    </div>
  </main>
</div>
<script>
const DATA = /*__DATA__*/null;
const posts = DATA.posts;
const PAGE = 50;
const PALETTE = ["#2563eb", "#ea580c", "#16a34a", "#db2777", "#7c3aed", "#0d9488", "#dc2626", "#4f46e5", "#a16207", "#0891b2", "#65a30d", "#9333ea"];
const SOURCE_LABEL = { bookmarks: "Bookmarks", likes: "Likes" };
// "New" = saved by the latest harvest of its source, once that source has been harvested more than once.
const runs = {};
for (const p of posts) if (p.h) (runs[p.s] ||= new Set()).add(p.h);
const lastRun = Object.fromEntries(Object.entries(runs).filter(([, r]) => r.size > 1).map(([s, r]) => [s, [...r].sort().pop()]));
const isFresh = (p) => p.h && p.h === lastRun[p.s];
const hasNewRun = Object.keys(lastRun).length > 0;

// Search index: lower-cased text, author and topic names, built once.
for (const p of posts) {
  p.year = p.d ? p.d.slice(0, 4) : "";
  p.hay = `${p.t}\n@${p.a}\n${p.tp}\n${p.st}`.toLowerCase();
  p.key = `${p.s}|${p.tp}`;
}

// Topics per source, biggest first, each with a stable colour.
const topicTree = {};
for (const p of posts) {
  const src = (topicTree[p.s] ||= {});
  const t = (src[p.tp] ||= { name: p.tp, n: 0, subs: {} });
  t.n++;
  if (p.st) t.subs[p.st] = (t.subs[p.st] || 0) + 1;
}
const colour = {};
for (const [src, topics] of Object.entries(topicTree)) {
  Object.values(topics).sort((a, b) => b.n - a.n).forEach((t, i) => colour[`${src}|${t.name}`] = PALETTE[i % PALETTE.length]);
}

const state = { q: "", src: "all", topic: "", sub: "", year: "", sort: "saved", fresh: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n.toLocaleString();

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(state)) if (h.has(k)) state[k] = k === "fresh" ? h.get(k) === "1" : h.get(k);
}
function writeHash() {
  const h = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v && !(k === "src" && v === "all") && !(k === "sort" && v === "saved")) h.set(k, v === true ? "1" : v);
  history.replaceState(null, "", h.toString() ? `#${h}` : location.pathname);
}

function parseQuery(q) {
  const terms = [], phrases = [], excludes = [], authors = [];
  q.replace(/"([^"]+)"|(\S+)/g, (_, phrase, word) => {
    if (phrase) phrases.push(phrase.toLowerCase());
    else if (word.startsWith("-") && word.length > 1) excludes.push(word.slice(1).toLowerCase());
    else if (word.startsWith("@") && word.length > 1) authors.push(word.slice(1).toLowerCase());
    else terms.push(word.toLowerCase());
  });
  return { terms, phrases, excludes, authors };
}

function filtered({ ignore = "" } = {}) {
  const q = parseQuery(state.q);
  return posts.filter((p) => {
    if (ignore !== "src" && state.src !== "all" && p.s !== state.src) return false;
    if (ignore !== "year" && state.year && p.year !== state.year) return false;
    if (ignore !== "topic" && state.topic && p.key !== state.topic) return false;
    if (ignore !== "topic" && state.sub && p.st !== state.sub) return false;
    if (state.fresh && !isFresh(p)) return false;
    if (q.authors.length && !q.authors.some((a) => p.a.toLowerCase().includes(a))) return false;
    for (const t of q.terms) if (!p.hay.includes(t)) return false;
    for (const t of q.phrases) if (!p.hay.includes(t)) return false;
    for (const t of q.excludes) if (p.hay.includes(t)) return false;
    return true;
  });
}

function sorted(list) {
  const by = {
    saved: (a, b) => (a.s === b.s ? a.o - b.o : a.s.localeCompare(b.s)),
    new: (a, b) => (b.d || "").localeCompare(a.d || "") || a.o - b.o,
    old: (a, b) => (a.d || "9999").localeCompare(b.d || "9999") || a.o - b.o,
    author: (a, b) => a.a.toLowerCase().localeCompare(b.a.toLowerCase()) || a.o - b.o,
  }[state.sort];
  return list.slice().sort(by);
}

function highlight(text) {
  const q = parseQuery(state.q);
  const needles = [...q.terms, ...q.phrases].filter((t) => t.length > 1);
  let html = esc(text);
  if (!needles.length) return html;
  const re = new RegExp(`(${needles.map((n) => esc(n).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
  return html.replace(re, "<mark>$1</mark>");
}

function avatarColour(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 45% 48%)`;
}

function prettyDate(p) {
  if (!p.d) return p.c;
  const d = new Date(p.d + "T00:00:00");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function card(p) {
  const c = colour[p.key];
  const url = `https://x.com/${encodeURIComponent(p.a)}/status/${p.id}`;
  const long = p.t.length > 420 || p.t.split("\n").length > 7;
  const fresh = isFresh(p);
  return `<article class="card" tabindex="-1" data-url="${url}">
    <div class="head">
      <div class="avatar" style="background:${avatarColour(p.a)}">${esc((p.a[0] || "?").toUpperCase())}</div>
      <div class="who"><a href="https://x.com/${encodeURIComponent(p.a)}" target="_blank" rel="noopener">@${highlight(p.a)}</a>
        <div class="sub">${esc(prettyDate(p))}${p.r ? " · reply" : ""}</div></div>
      ${fresh ? '<span class="badge new">New</span>' : ""}
      <span class="badge">${p.s === "likes" ? "♥ Like" : "★ Bookmark"}</span>
      <a class="open" href="${url}" target="_blank" rel="noopener">Open ↗</a>
    </div>
    <div class="text${long ? " clamp" : ""}">${highlight(p.t) || '<span style="color:var(--ink-3)">(no text — media only)</span>'}</div>
    ${long ? '<button class="more">Show more</button>' : ""}
    <div class="foot">
      <button class="tag main" data-topic="${esc(p.key)}" style="--c:${c}">${esc(p.tp)}</button>
      ${p.st ? `<span class="sep">›</span><button class="tag sub" data-topic="${esc(p.key)}" data-sub="${esc(p.st)}" style="--c:${c}">${esc(p.st)}</button>` : ""}
      ${p.m.length ? `<span class="media">${p.m.map((m) => (m === "video" ? "▶ video" : "▣ photo")).join(" · ")}</span>` : ""}
    </div>
  </article>`;
}

let results = [], shown = 0, focusIndex = -1;

function renderList() {
  results = sorted(filtered());
  shown = 0;
  focusIndex = -1;
  $("list").innerHTML = results.length ? "" : '<div class="empty">Nothing matches. Try fewer words.</div>';
  $("count").textContent = `${fmt(results.length)} ${results.length === 1 ? "post" : "posts"}`;
  more();
}
function more() {
  if (shown >= results.length) return;
  $("list").insertAdjacentHTML("beforeend", results.slice(shown, shown + PAGE).map(card).join(""));
  shown = Math.min(results.length, shown + PAGE);
}

function renderSources() {
  const base = filtered({ ignore: "src" });
  const n = (s) => base.filter((p) => s === "all" || p.s === s).length;
  $("sources").innerHTML = ["all", "bookmarks", "likes"].map((s) =>
    `<button data-src="${s}" aria-pressed="${state.src === s}">${s === "all" ? "All" : SOURCE_LABEL[s]}<small>${fmt(n(s))}</small></button>`).join("");
}

function renderYears() {
  const base = filtered({ ignore: "year" });
  const all = [...new Set(posts.map((p) => p.year).filter(Boolean))].sort();
  const counts = Object.fromEntries(all.map((y) => [y, 0]));
  for (const p of base) if (p.year) counts[p.year]++;
  const max = Math.max(1, ...Object.values(counts));
  $("years").innerHTML = all.map((y) =>
    `<button data-year="${y}" aria-pressed="${state.year === y}" title="${y}: ${counts[y]} posts"><i style="height:${Math.max(2, (counts[y] / max) * 40)}px"></i><span>'${y.slice(2)}</span></button>`).join("");
}

function renderTopics() {
  const base = filtered({ ignore: "topic" });
  const live = {};
  for (const p of base) {
    live[p.key] = (live[p.key] || 0) + 1;
    if (p.st) live[`${p.key}|${p.st}`] = (live[`${p.key}|${p.st}`] || 0) + 1;
  }
  const sources = state.src === "all" ? Object.keys(topicTree) : [state.src];
  $("topics").innerHTML = sources.filter((s) => topicTree[s]).map((src) => {
    const topics = Object.values(topicTree[src]).sort((a, b) => b.n - a.n);
    return `<div class="group-title"><span>${SOURCE_LABEL[src] || src}</span></div>` + topics.map((t) => {
      const key = `${src}|${t.name}`;
      const open = state.topic === key;
      const subs = open ? `<div class="subs">${Object.entries(t.subs).sort((a, b) => b[1] - a[1]).map(([s]) =>
        `<button class="topic" data-topic="${esc(key)}" data-sub="${esc(s)}" aria-pressed="${state.sub === s}"><span class="name">${esc(s)}</span><span class="n">${fmt(live[`${key}|${s}`] || 0)}</span></button>`).join("")}</div>` : "";
      return `<button class="topic" data-topic="${esc(key)}" aria-pressed="${open && !state.sub}"><span class="dot" style="background:${colour[key]}"></span><span class="name">${esc(t.name)}</span><span class="n">${fmt(live[key] || 0)}</span></button>${subs}`;
    }).join("");
  }).join("");
}

function renderChips() {
  const chips = [];
  if (state.topic) chips.push(["topic", state.topic.split("|")[1] + (state.sub ? ` › ${state.sub}` : "")]);
  if (state.year) chips.push(["year", state.year]);
  if (state.fresh) chips.push(["fresh", "New in last harvest"]);
  $("chips").innerHTML = chips.map(([k, label]) => `<span class="chip">${esc(label)}<button data-clear="${k}" aria-label="Remove">×</button></span> `).join("");
}

function render() {
  writeHash();
  renderSources();
  renderYears();
  renderTopics();
  renderChips();
  renderList();
  $("sort").value = state.sort;
  $("fresh").setAttribute("aria-pressed", state.fresh);
}

function setFocus(i) {
  const cards = [...document.querySelectorAll(".card")];
  if (!cards.length) return;
  while (i >= cards.length && shown < results.length) { more(); cards.splice(0, cards.length, ...document.querySelectorAll(".card")); }
  focusIndex = Math.max(0, Math.min(cards.length - 1, i));
  cards.forEach((c) => c.classList.remove("focus"));
  const c = cards[focusIndex];
  c.classList.add("focus");
  c.focus({ preventScroll: true });
  c.scrollIntoView({ block: "center", behavior: "smooth" });
}

// Events.
let timer;
$("q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; render(); }, 110); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
$("fresh").addEventListener("click", () => { state.fresh = !state.fresh; render(); });
$("reset").addEventListener("click", () => { Object.assign(state, { q: "", src: "all", topic: "", sub: "", year: "", fresh: false }); $("q").value = ""; render(); });
$("filters-btn").addEventListener("click", () => document.body.classList.add("drawer"));
$("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.src) { state.src = t.dataset.src; if (state.topic && !state.topic.startsWith(state.src + "|") && state.src !== "all") { state.topic = state.sub = ""; } render(); }
  else if (t.dataset.year) { state.year = state.year === t.dataset.year ? "" : t.dataset.year; render(); }
  else if (t.dataset.topic) {
    const sub = t.dataset.sub || "";
    if (state.topic === t.dataset.topic && state.sub === sub && !t.classList.contains("tag")) { state.topic = sub ? state.topic : ""; state.sub = ""; }
    else { state.topic = t.dataset.topic; state.sub = sub; }
    render();
    if (t.classList.contains("tag")) window.scrollTo({ top: 0, behavior: "smooth" });
  }
  else if (t.dataset.clear) {
    if (t.dataset.clear === "topic") state.topic = state.sub = "";
    else if (t.dataset.clear === "fresh") state.fresh = false;
    else state[t.dataset.clear] = "";
    render();
  }
  else if (t.classList.contains("more")) {
    const text = t.previousElementSibling;
    const clamped = text.classList.toggle("clamp");
    t.textContent = clamped ? "Show more" : "Show less";
  }
});
document.addEventListener("keydown", (e) => {
  const typing = e.target === $("q");
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); $("q").select(); }
  else if (e.key === "Escape" && typing) { if ($("q").value) { $("q").value = ""; state.q = ""; render(); } else $("q").blur(); }
  else if (e.key === "Escape") document.body.classList.remove("drawer");
  else if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  else if (e.key === "j") setFocus(focusIndex + 1);
  else if (e.key === "k") setFocus(focusIndex - 1);
  else if ((e.key === "o" || e.key === "Enter") && focusIndex >= 0) window.open(document.querySelectorAll(".card")[focusIndex].dataset.url, "_blank");
});
new IntersectionObserver((entries) => entries[0].isIntersecting && more(), { rootMargin: "800px" }).observe($("sentinel"));

// Theme: follows the system, the button cycles light / dark / system.
const themes = ["system", "light", "dark"];
let theme = "system";
try { theme = localStorage.getItem("saved-posts-theme") || "system"; } catch {}
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme").textContent = `◐ ${theme[0].toUpperCase()}${theme.slice(1)}`;
}
$("theme").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { localStorage.setItem("saved-posts-theme", theme); } catch {}
  applyTheme();
});

const counts = Object.fromEntries(Object.keys(SOURCE_LABEL).map((s) => [s, posts.filter((p) => p.s === s).length]));
$("meta").textContent = `${fmt(counts.bookmarks)} bookmarks · ${fmt(counts.likes)} likes · built ${DATA.built}`;
$("fresh").hidden = !hasNewRun;
readHash();
$("q").value = state.q;
applyTheme();
render();
</script>
</body>
</html>
